[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heatsense"
version = "0.1.0"
description = "HeatSense: Predictive Analytics for Heat Risk"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2.3.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "xarray>=2024.2.0",
    "h5netcdf>=1.3.0",
    "h5py>=3.10.0",
    "netCDF4>=1.6.5",
    "pyarrow>=15.0.0",
    "joblib>=1.3.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "backend/src/heatsense_api",
    "ml/src/heatsense_ml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src", "ml/src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
